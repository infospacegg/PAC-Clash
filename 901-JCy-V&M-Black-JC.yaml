# 1. 基础设置
mixed-port: 7890
allow-lan: true
unified-delay: true
tcp-concurrent: true
ipv6: true
bind-address: '*'
mode: rule
log-level: info
external-controller: '127.0.0.1:9090'


dns:
    enable: true
    ipv6: true
    default-nameserver: [223.5.5.5, 119.29.29.29, 180.184.1.1]
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    use-hosts: true
    nameserver: ['https://dns.alidns.com/dns-query', 'https://doh.pub/dns-query']
    fallback: ['https://223.5.5.5/dns-query', 'https://223.6.6.6/dns-query', 'https://doh.360.cn/dns-query']
    fallback-filter: { geoip: true, geoip-code: CN, geosite: [gfw], ipcidr: [240.0.0.0/4], domain: [+.google.com, +.facebook.com, +.youtube.com] }

