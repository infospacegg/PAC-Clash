# ======================================================================
# == Clash Verge 调度配置文件 (终极融合版) ==
# == 基于专业配置，融入您的特殊需求 ==
# ======================================================================

# 1. 基础设置
mixed-port: 7890
allow-lan: true
unified-delay: true
tcp-concurrent: true
ipv6: true
bind-address: '*'
mode: rule
log-level: info
external-controller: '127.0.0.1:9090'


dns:
    enable: true
    ipv6: true
    default-nameserver: [223.5.5.5, 119.29.29.29, 180.184.1.1]
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    use-hosts: true
    nameserver: ['https://dns.alidns.com/dns-query', 'https://doh.pub/dns-query', 180.184.1.1]
    fallback: ['https://223.5.5.5/dns-query', 'https://223.6.6.6/dns-query', 'https://doh.360.cn/dns-query', 180.184.1.1]
    fallback-filter: { geoip: true, geoip-code: CN, geosite: [gfw], ipcidr: [240.0.0.0/4], domain: [+.google.com, +.facebook.com, +.youtube.com] }


# 3. 代理节点 (Proxies) - 替换为您自己的本地引擎
proxies:
  - name: "V-CF"
    type: socks5
    server: 127.0.0.1
    port: 10808

  - name: "M"
    type: socks5
    server: 127.0.0.1
    port: 9909 # 请确认您的VPN端口是这个

# 4. 代理组 (Proxy Groups) - 替换为您自己的策略组
proxy-groups:
  - name: "AI-SPECIAL-PROXY"
    type: select
    proxies:
      - "M"
      - "V-CF"

  - name: "DEFAULT-PROXY"
    type: select
    proxies:
      - "V-CF"
      - "M"

# 5. 规则 (Rules) - 在专业规则的基础上，增加了我们的规则
rules:
  # (5.0) 【新增】您的个人永久直连规则 (最高优先级之一)
  #- DOMAIN-SUFFIX,anaconda.com,DIRECT
  
  # (5.1) 【新增】我们的特殊AI及工作网站规则 (最高优先级)
  - DOMAIN-KEYWORD,grok,AI-SPECIAL-PROXY
  - DOMAIN-KEYWORD,openai,AI-SPECIAL-PROXY
  - DOMAIN-KEYWORD,claude,AI-SPECIAL-PROXY
  - DOMAIN-KEYWORD,aistudio,AI-SPECIAL-PROXY
  - DOMAIN-KEYWORD,makersuite,AI-SPECIAL-PROXY
  - DOMAIN-KEYWORD,copilot.microsoft,AI-SPECIAL-PROXY
  - DOMAIN-KEYWORD,bing.com,AI-SPECIAL-PROXY
  - DOMAIN-KEYWORD,chat.bing,AI-SPECIAL-PROXY
  - DOMAIN-KEYWORD,gitlab.com,AI-SPECIAL-PROXY


  # (5.2) 【沿用并修改】专业配置中的所有规则
