#（一区）=============================（clash配置）
#dns可自行修改
port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
global-client-fingerprint: chrome
dns:
  enable: true
  listen: :53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: 
    - 223.5.5.5
    - 8.8.8.8
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.0.0.1/dns-query
    - tls://dns.google
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4


#（二区）==============================（代理协议）
#当前12个协议节点配置模版，按需求修改，如某协议节点不用，则无需删除，确保三区代理分流中没有该name节点名称即可
proxy-providers:
  cfzy031801:
    type: http
    url: "http://localhost:9090/clash/proxies?type=file&path=cfzy031801.yaml"
    path: ./providers/cfzy031801.yaml
    health-check:
      enable: true
      interval: 600
      url: https://www.gstatic.com/generate_204


proxies:


#（三区）==============================（代理分流）
#分流组可自行创建添加，proxies参数下的name节点名称，按需求自行增减，确保出现的name节点名称在二区代理协议中可查找
proxy-groups:
- name: 负载均衡
  type: load-balance
  use:
    - cfzy031801
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  strategy: round-robin
  filter: "CF_V6"


- name: 自动选择
  type: url-test
  use:
    - cfzy031801
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
  filter: "CF_V6"

    
- name: 🌍选择代理节点
  type: select
  proxies:
    - 负载均衡
    - 自动选择
    - DIRECT
  use:
    - cfzy031801
  filter: "CF_V6"


- name: "Gemini"
  type: select
  use:
    - cfzy031801
  filter: "Europe"


- name: CF_V6HK节点组
  type: select
  use:
    - cfzy031801
  filter: "Asia"


- name: CF_V6EU节点组
  type: select
  use:
    - cfzy031801
  filter: "Europe"


- name: CF_V6NA节点组
  type: select
  use:
    - cfzy031801
  filter: "North America"


- name: cfzy负载均衡
  type: load-balance
  use:
    - cfzy031801
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  strategy: round-robin
  filter: "CF_V6"

- name: cfzy自动选择  
  type: url-test
  use:
    - cfzy031801
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
  filter: "CF_V6"

#（四区）==============================（代理规则）
