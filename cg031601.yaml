#====Clash-meta精简配置文件模版：更新至15个主流节点（V23.12.19）=====
#====参考自clash-meta官方文档：wiki.metacubex.one=====

#（一区）=============================（clash配置）
#dns可自行修改
port: 7890
allow-lan: true
mode: rule
log-level: info
unified-delay: true
global-client-fingerprint: chrome
dns:
  enable: true
  listen: :53
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: 
    - 223.5.5.5
    - 8.8.8.8
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.0.0.1/dns-query
    - tls://dns.google
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4


#（二区）==============================（代理协议）
#当前12个协议节点配置模版，按需求修改，如某协议节点不用，则无需删除，确保三区代理分流中没有该name节点名称即可
proxy-providers:
  cfzy:
    type: http
    path: ./ProxySet/cfzy/cfzy.yaml
    url: "https://gitlab.com/api/v4/projects/67911760/repository/files/proxies.yaml/raw?ref=main&private_token=glpat-Eu2whgwSfLtBymi26RF9"
    interval: 1800
    filter: 
    health-check:
      enable: true
      url: http://www.gstatic.com/generate_204
      interval: 300

#（三区）==============================（代理分流）
#分流组可自行创建添加，proxies参数下的name节点名称，按需求自行增减，确保出现的name节点名称在二区代理协议中可查找
proxy-groups:
- name: 负载均衡
  type: load-balance
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  strategy: round-robin
  use:
    - cfzy

- name: 自动选择
  type: url-test
  url: https://cp.cloudflare.com/generate_204
  interval: 300
  tolerance: 50
  use:
    - cfzy
    
- name: 🌍选择代理节点
  type: select
  use:
    - cfzy
  proxies:
    - 负载均衡
    - 自动选择
    - DIRECT
    - "CFT1208节点组"
    - "CFV1208节点组"
    - "YP节点组"
    - "Gemini"

- name: PROXY
  type: select
  use:
    - cfzy
  proxies:
    - 🌍选择代理节点
    - 负载均衡
    - 自动选择
    - "CFT1208节点组"
    - "CFV1208节点组"
    - "YP节点组"
    - "Gemini"
    - DIRECT

- name: "Gemini"
  type: select
  use:
    - cfzy
  filter: "FRA|Frankfurt"

- name: "CFT1208节点组"
  type: select
  use:
    - cfzy
  filter: "CF_T"

- name: "CFV1208节点组"
  type: select
  use:
    - cfzy
  filter: "CF_V"

- name: "YP节点组"
  type: select
  use:
    - cfzy
  filter: "YP_V"

