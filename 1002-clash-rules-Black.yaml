# 基础设置
mixed-port: 7890
allow-lan: true
unified-delay: true
tcp-concurrent: true
ipv6: true
bind-address: '*'
mode: rule
log-level: info  # 推荐生产环境使用 info，避免敏感信息泄露
external-controller: '127.0.0.1:9090'

# DNS 设置（使用 redir-host，优先直连）
dns:
  enable: true
  ipv6: true
  default-nameserver: [223.5.5.5, 119.29.29.29]  # 国内 DNS 优先
  enhanced-mode: redir-host  # 使用 redir-host，避免 fake-ip 干扰
  use-hosts: true
  nameserver: ['https://dns.alidns.com/dns-query', 'https://doh.pub/dns-query']
  fallback: ['https://8.8.8.8/dns-query', 'https://1.1.1.1/dns-query']
  nameserver-policy:
    'anaconda.com': [223.5.5.5, 119.29.29.29]  # 强制使用国内 DNS
    'www.anaconda.com': [223.5.5.5, 119.29.29.29]
    'python.org': [223.5.5.5, 119.29.29.29]
    'pypi.org': [223.5.5.5, 119.29.29.29]
    'numpy.org': [223.5.5.5, 119.29.29.29]
  fallback-filter: { geoip: true, geoip-code: CN }

# 代理节点
proxies:
  - name: "V-CF"
    type: socks5
    server: 127.0.0.1
    port: 10808
  - name: "M"
    type: socks5
    server: 127.0.0.1
    port: 9909


# 代理组
proxy-groups:
  - name: "AI-SPECIAL-PROXY"
    type: select
    proxies:
      - "M"
      - "V-CF"
  - name: "PROXY"
    type: select
    proxies:
      - "V-CF"
      - "M"
  - name: "Cloudflare-Check"  # 名字可以自己取，方便识别即可
    type: select              # 使用 select 类型，方便您手动选择最有效的节点
    proxies:
      - "M"

# Rule Providers（使用 Loyalsoldier/clash-rules）
rule-providers:
  reject:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt"
    path: ./ruleset/reject.yaml
    interval: 86400
  icloud:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/icloud.txt"
    path: ./ruleset/icloud.yaml
    interval: 86400
  apple:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/apple.txt"
    path: ./ruleset/apple.yaml
    interval: 86400
  google:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/google.txt"
    path: ./ruleset/google.yaml
    interval: 86400
  proxy:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt"
    path: ./ruleset/proxy.yaml
    interval: 86400
  direct:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt"
    path: ./ruleset/direct.yaml
    interval: 86400
  private:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt"
    path: ./ruleset/private.yaml
    interval: 86400
  gfw:
    type: http
    behavior: domain
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/gfw.txt"
    path: ./ruleset/gfw.yaml
    interval: 86400
  telegramcidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/telegramcidr.txt"
    path: ./ruleset/telegramcidr.yaml
    interval: 86400
  cncidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt"
    path: ./ruleset/cncidr.yaml
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt"
    path: ./ruleset/lancidr.yaml
    interval: 86400
  applications:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400

# 规则（黑名单模式，默认直连）
rules:
  # 自定义规则：AI 相关网站走 AI-SPECIAL-PROXY
  - DOMAIN-KEYWORD,grok,AI-SPECIAL-PROXY
  - DOMAIN-KEYWORD,openai,AI-SPECIAL-PROXY
  - DOMAIN-KEYWORD,claude,AI-SPECIAL-PROXY
  - DOMAIN-KEYWORD,aistudio,AI-SPECIAL-PROXY
  - DOMAIN-KEYWORD,makersuite,AI-SPECIAL-PROXY
  # 自定义规则：未屏蔽国外网站直连
  - DOMAIN-SUFFIX,anaconda.com,DIRECT
  - DOMAIN-SUFFIX,python.org,DIRECT
  - DOMAIN-SUFFIX,pypi.org,DIRECT
  - DOMAIN-SUFFIX,numpy.org,DIRECT
  # Cloudflare IP 范围（anaconda.com 使用 Cloudflare CDN，仅限实际使用的 IP 段）
  # 可通过 DNS 查询 anaconda.com 的实际 IP 段后补充
  # 例如（请根据实际情况调整）:
  # - IP-CIDR,104.16.16.0/20,DIRECT
  # - IP-CIDR,104.17.32.0/20,DIRECT
  # 如果不确定，可暂时移除此规则以避免影响其他服务
  # Loyalsoldier 规则集
  - RULE-SET,applications,DIRECT
  - DOMAIN,clash.razord.top,DIRECT
  - DOMAIN,yacd.haishan.me,DIRECT
  - RULE-SET,private,DIRECT
  - RULE-SET,reject,REJECT
  - RULE-SET,icloud,DIRECT
  - RULE-SET,apple,DIRECT
  - RULE-SET,google,PROXY
  - RULE-SET,proxy,PROXY
  - RULE-SET,direct,DIRECT
  - RULE-SET,gfw,PROXY
  - RULE-SET,lancidr,DIRECT
  - RULE-SET,cncidr,DIRECT
  - RULE-SET,telegramcidr,PROXY
  - GEOIP,LAN,DIRECT
  - GEOIP,CN,DIRECT
  - MATCH,DIRECT