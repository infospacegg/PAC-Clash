# 1. 基础设置
mixed-port: 7890
allow-lan: true
unified-delay: true
tcp-concurrent: true
ipv6: true
bind-address: '*'
mode: rule
log-level: info
external-controller: '127.0.0.1:9090'
hosts:
    dns.alidns.com: [223.5.5.5, '2400:3200::1']
    doh.pub: [1.12.12.12, 120.53.53.53]

# 2. DNS 设置


dns:
    enable: true
    ipv6: true
    default-nameserver: [223.5.5.5, 119.29.29.29, 180.184.1.1]
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    use-hosts: true
    nameserver: ['https://dns.alidns.com/dns-query', 'https://doh.pub/dns-query']
    fallback: ['https://223.5.5.5/dns-query', 'https://223.6.6.6/dns-query', 'https://doh.360.cn/dns-query']
    fallback-filter: { geoip: true, geoip-code: CN, geosite: [gfw], ipcidr: [240.0.0.0/4], domain: [+.google.com, +.facebook.com, +.youtube.com] }



# 3. 代理节点 (Proxies) - 替换为您自己的本地引擎
proxies:
  - name: "V-CF"
    type: socks5
    server: 127.0.0.1
    port: 10808

  - name: "M"
    type: socks5
    server: 127.0.0.1
    port: 9909 # 请确认您的VPN端口是这个

  - name: "M-h"
    type: http
    server: 127.0.0.1
    port: 9910 # 请确认您的VPN端口是这个







# 3.5. Proxy Providers - 关键部分！从这里开始
proxy-providers:
  # Provider 名称（自定义，后面会用到）
  nc:
    # 类型：http 表示从网络获取订阅
    type: http
    url: 'https://47.238.198.94/iv/verify_mode.htm?token=8cd96993c7eb65a4d1ea9ed27e37b362'

    # 更新间隔（秒）：3600 = 1小时自动更新一次
    interval: 3600
    path: ./providers/nc_local-black-1116.yaml
    # 移到 header 下
    header:
      User-Agent:
        - "Clash Verge/2.4.2"  # 或 "Clash Verge/2.4.2" 来模拟 Verge 客户端
    health-check:
      enable: false
      url: 'http://www.gstatic.com/generate_204'
      interval: 1800
      lazy: true

  v2c:
    type: http
    url: "https://gitlab.com/api/v4/projects/67911760/repository/files/v2c.yaml/raw?ref=main&private_token=glpat-Eu2whgwSfLtBymi26RF9" # <-- 还是用同一个订阅链接
    interval: 3600
    path: ./providers/v2c.yaml # <-- 建议用一个新文件名
    health-check:
      enable: true
      url: 'https://1.1.1.1/cdn-cgi/trace' 
      interval: 180
      timeout: 2000  # 2s 超时，防卡
      lazy: true  # 只在用时查
      expected-status: 200  # 明确响应码

  GLaDOS-Nodes:
    type: http
    url: "https://update.glados-config.com/mihomo/685533/bfbfc7d/83489/glados.yaml"
    interval: 3600
    path: ./providers/local_glados.yaml
    health-check:
      enable: true
      interval: 600
      url: http://www.gstatic.com/generate_204

# 4. 代理组 (Proxy Groups) - 替换为您自己的策略组2
proxy-groups:
  - name: "AI-SPECIAL-PROXY"
    type: select
    use:
      - nc
      - v2c
      - GLaDOS-Nodes
    filter: "(?i)HK|Hong Kong|SG|Singapore|US|United States|Tw|Taiwan|Jp|Japan|猎户座|Whzsmss" # 只要这些节点用于此策略组（示例过滤）
    proxies:
      - '♻️ 自动选择'
      - "M" 
      - "M-h"             # 优先级1：本地 M 节点（省流量）
      - "V-CF"
    url: 'http://www.gstatic.com/generate_204'      # 健康检查 URL
    interval: 300       # 检查间隔：300秒 = 5分钟检查一次
    tolerance: 1500      # 容忍延迟：1500毫秒 = 1.5秒

  - name: '♻️ 自动选择'
    type: url-test
    use:
      - nc
    url: 'http://www.gstatic.com/generate_204'
    interval: 1800


  - name: "CF-D"  # 策略组名字，你可以随便改
    type: select
    url: 'http://www.gstatic.com/generate_204' # 用于测试连通性的地址
    interval: 300   # 每300秒检测一次
    tolerance: 50   # 容差，防止频繁跳动
    proxies:
      - "V-CF"
      - DIRECT
      - Whzsmss20260212-ypdq
      - GLaDOS-SG


  - name: "DEFAULT-PROXY"
    type: select
    use:
      - nc
      - v2c
      - GLaDOS-Nodes
    proxies:
      - "V2C-test"
      - "V2C-Whzsmss"
      - "V-CF"
      - "M"
      - "M-h"
      - GLaDOS-SG
      - '♻️ 自动选择'
     
  - name: "NC-auto-all"
    type: select
    use:
      - nc

  - name: "huggingface_ProxyGroup"
    type: select
    use:
      - v2c
    proxies:
      - "V2C-test"
      - "V2C-Whzsmss"
      - "V-CF"
      - "M"
      - "M-h"

  - name: "V2C-Whzsmss"
    type: select
    use:
      - v2c # Clash 会自动把 my-airport-whzsmss provider 里的所有节点都加进来

  - name: "V2C-test"
    type: url-test
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 300
    tolerance: 500  # 降低切换阈值
    timeout: 3000
    expected-status: 204
    lazy: true  # 只在用时测速
    use:
      - v2c

  - name: "NC-auto-LHZ-BGP"
    type: select
    use:
      - nc
    filter: "GP"     # 只包含PG

  - name: "NC-auto-HK"
    type: select
    use:
      - nc
    filter: "香"

  - name: "NC-auto-猎户座"
    type: select
    use:
      - nc
    filter: "猎户座"

  - name: "NC-auto-US"
    type: select
    use:
      - nc
    filter: "美"

  - name: "GLaDOS-SG"
    type: select
    use:
      - GLaDOS-Nodes
    filter: "SG|Singapore"  # 正则过滤：只显示新加坡节点

  - name: "GLaDOS-US"
    type: select
    use:
      - GLaDOS-Nodes
    filter: "US|United States"  # 正则过滤：只显示美国节点

  - name: "GLaDOS-HK"
    type: select
    use:
      - GLaDOS-Nodes
    filter: "HK|Hong Kong"  # 正则过滤：只显示香港节点

  - name: "GLaDOS-JP"
    type: select
    use:
      - GLaDOS-Nodes
    filter: "JP|Japan"  # 正则过滤：只显示日本节点

  - name: "GLaDOS-TW"
    type: select
    use:
      - GLaDOS-Nodes
    filter: "TW|Taiwan"  # 正则过滤：只显示台湾节点

  - name: "GLaDOS-DE"
    type: select
    use:
      - GLaDOS-Nodes
    filter: "DE|Germany"  # 正则过滤：只显示德国节点

  - name: "GLaDOS-UK"
    type: select
    use:
      - GLaDOS-Nodes
    filter: "UK|United Kingdom"  # 正则过滤：只显示英国节点

  - name: "GLaDOS-KR"
    type: select
    use:
      - GLaDOS-Nodes
    filter: "KR|Korea"  # 正则过滤：只显示韩国节点

  - name: "GLaDOS-CA"
    type: select
    use:
      - GLaDOS-Nodes
    filter: "CA|Canada"  # 正则过滤：只显示加拿大节点

  - name: "GLaDOS-AU"
    type: select
    use:
      - GLaDOS-Nodes
    filter: "AU|Australia"  # 正则过滤：只显示澳大利亚节点

  - name: "GLaDOS-FR"
    type: select
    use:
      - GLaDOS-Nodes
    filter: "FR|France"  # 正则过滤：只显示法国节点


